name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ponytail: pandas + requests only. vllm/torch need a GPU and multi-GB wheels,
      # and every experiment needs assets/CVEfixes.db, which is not in the repo.
      - run: pip install pandas requests pytest ruff

      - name: Lint (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 *.py tests

      - name: Smoke tests
        run: pytest -q
